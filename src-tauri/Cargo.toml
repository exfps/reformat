[package]
name = "reformat"
version = "1.1.0"
description = "Private document and media conversion workbench"
authors = ["Reformat"]
edition = "2021"

[lib]
name = "reformat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3"
lopdf = "0.47"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
zip = "9.8"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
xz2 = "0.1"
sevenz-rust = { version = "0.6", features = ["aes256"] }
walkdir = "2"
docx-rs = "0.4"
serde_json = "1"
